services:
  statis:
    container_name: statis
    image: ghcr.io/jesperrichert/statis:latest
    environment:
      STATIS_FAVICON: "/bloby.png"
      STATIS_APP_TITLE: "Blo.by Status"
      STATIS_DISABLE_FRONTEND: false
      STATIS_AUTO_CONFIG_INTERVAL: 30 # seconds
      STATIS_WEBHOOKS: ""
      STATIS_EVENTS: ""
      STATIS_INCIDENCES: ""
      STATIS_MONITORS: ""
    volumes:
      - "./storage/bloby.png:/bloby.png"
      - "./storage/db.sqlite:/app/db.sqlite"
    ports:
      - "4000:3000"
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
