services:
  statis:
    container_name: statis
    image: ghcr.io/jesperrichert/statis:latest
    environment:
      STATIS_FAVICON: "/icon.png"
      STATIS_APP_TITLE: "Statis"
      STATIS_DISABLE_FRONTEND: false
      STATIS_AUTO_CONFIG_INTERVAL: 30 # seconds
      STATIS_WEBHOOKS: "url"
      STATIS_EVENTS: "url"
      STATIS_INCIDENCES: "url"
      STATIS_MONITORS: "url"
    volumes:
      - "./storage/icon.png:/icon.png"
      - "./storage/db.sqlite:/app/db.sqlite"
    ports:
      - "4000:3000"
    env_file:
      - .env